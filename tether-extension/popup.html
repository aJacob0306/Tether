<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tether</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 16px;
        width: 320px;
        font-family: system-ui, -apple-system, sans-serif;
        color: #111;
        background: #fff;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 18px;
      }

      p {
        margin: 0 0 16px;
        font-size: 13px;
        color: #555;
      }

      label {
        display: block;
        margin-bottom: 4px;
        font-size: 12px;
        font-weight: 600;
      }

      input {
        width: 100%;
        margin-bottom: 12px;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 13px;
      }

      button {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }

      #sign-in-btn {
        background: #111;
        color: #fff;
      }

      #sign-out-btn {
        background: #f3f3f3;
        color: #111;
        margin-top: 8px;
      }

      #sync-now-btn {
        background: #2563eb;
        color: #fff;
        margin-top: 8px;
      }

      #status {
        margin-top: 12px;
        font-size: 12px;
        color: #555;
        min-height: 16px;
      }

      #status.error {
        color: #b00020;
      }

      #signed-in-view {
        display: none;
      }

      .email-display {
        font-size: 13px;
        margin-bottom: 12px;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <h1>Tether</h1>
    <p>Sign in to sync allowlisted websites only. Configure rules in the mobile app.</p>

    <div id="signed-out-view">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com" />

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="Password" />

      <button id="sign-in-btn" type="button">Sign in</button>
    </div>

    <div id="signed-in-view">
      <div class="email-display" id="user-email"></div>
      <button id="sync-now-btn" type="button">Sync now</button>
      <button id="sign-out-btn" type="button">Sign out</button>
    </div>

    <div id="status"></div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
