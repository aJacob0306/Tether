[project]
name = "tether-desktop"
version = "0.1.0"
description = "Tether desktop companion: registers this machine, uploads installed apps, and tracks allowlisted foreground apps."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "supabase>=2.31",
    "httpx>=0.28",
    "python-dotenv>=1.2",
    "platformdirs>=4.11",
    "pillow>=12.0",
    "psutil>=7.0",
    "pyobjc-framework-Cocoa>=12.2; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=12.2; sys_platform == 'darwin'",
    "pywin32>=312; sys_platform == 'win32'",
    "pywebview>=6.2.1",
]

[project.scripts]
tether-desktop = "tether_desktop.cli:main"

[project.gui-scripts]
tether-desktop-gui = "tether_desktop.ui:run_window"

[dependency-groups]
dev = ["pytest>=8.0"]
package = ["pyinstaller>=6.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tether_desktop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
